<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
<defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs>
<style>
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  
    .ecur{animation:eblink 1.1s steps(1) infinite}
    @keyframes eblink{0%{opacity:0}50%{opacity:1}}
    .escan{opacity:0;animation:escan 6s linear infinite}
    @keyframes escan{0%,70%{transform:translateY(-12px);opacity:0}72%{opacity:.12}92%{transform:translateY(112px);opacity:.12}93%,100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g transform="translate(16 20)"><g class="float">
  <clipPath id="ec"><rect width="108" height="108" rx="24"/></clipPath>
  <rect x="4" y="12" width="100" height="104" rx="24" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <g clip-path="url(#ec)">
    <rect width="108" height="108" fill="#000"/>
    <image href="data:image/png;base64," width="108" height="108"/>
    <rect class="ecur" x="81.00" y="78.89" width="6.75" height="6.33" fill="#e96b00"/>
    <rect class="escan" x="0" y="0" width="108" height="10" fill="#fff"/>
  </g>
  <rect x="0.75" y="0.75" width="106.5" height="106.5" rx="23.3" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
</g></g>
</svg>
