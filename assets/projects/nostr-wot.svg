<defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs>
<style>
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  
    .ae1,.ae2{stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.45;animation:adraw 4.8s ease-out infinite}
    @keyframes adraw{0%{stroke-dashoffset:1;opacity:.45}22%{stroke-dashoffset:0;opacity:.45}70%{stroke-dashoffset:0;opacity:.45}88%,100%{stroke-dashoffset:0;opacity:0}}
    .an1{fill:#fff;opacity:.9;transform-box:fill-box;transform-origin:center;animation:apop 4.8s ease-out infinite}
    .an2{fill:#fff;opacity:.6;transform-box:fill-box;transform-origin:center;animation:apop 4.8s ease-out infinite}
    @keyframes apop{0%,4%{transform:scale(1)}10%{transform:scale(1.35)}18%,100%{transform:scale(1)}}
    .acore{fill:#fff;transform-box:fill-box;transform-origin:center;animation:abeat 4.8s ease-in-out infinite}
    @keyframes abeat{0%{transform:scale(1)}6%{transform:scale(1.22)}14%,100%{transform:scale(1)}}
    .aring{fill:none;stroke:#fff;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:aring 4.8s ease-out infinite}
    @keyframes aring{0%{transform:scale(1);opacity:.7}35%,100%{transform:scale(5.5);opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
