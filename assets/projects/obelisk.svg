<svg xmlns="http://www.w3.org/2000/svg" width="140" height="150" viewBox="0 0 140 150">
<defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs>
<style>
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  
    .csweep{animation:csw 5s ease-in-out infinite}
    @keyframes csw{0%,55%{transform:rotate(20deg) translateX(0)}85%,100%{transform:rotate(20deg) translateX(190px)}}
    .ctw{opacity:0;animation:ctw 5s ease-in-out infinite}
    .ctw path{transform-box:fill-box;transform-origin:center;animation:cspin 5s ease-in-out infinite}
    @keyframes ctw{0%,68%{opacity:0}76%{opacity:1}88%,100%{opacity:0}}
    @keyframes cspin{0%,66%{transform:scale(.2) rotate(0)}76%{transform:scale(1) rotate(45deg)}90%,100%{transform:scale(.2) rotate(90deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g transform="translate(16 20)"><g class="float">
  <clipPath id="cc"><rect width="108" height="108" rx="24"/></clipPath>
  <rect x="4" y="12" width="100" height="104" rx="24" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <g clip-path="url(#cc)">
    <rect width="108" height="108" fill="#b4f04c"/>
    <defs><linearGradient id="csh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <g transform="translate(13.55 16.08) scale(0.158)"><path d="M 256,16 L 291.71,61.58 L 311.61,464 L 200.39,464 L 220.29,61.58 Z M 251.04,37.85 L 230.28,64.27 L 210.53,454.57 L 251.04,454.57 Z" fill="#0b0b0b" fill-rule="evenodd"/></g>
    <rect class="csweep" x="-60" y="-30" width="34" height="170" fill="url(#csh)" transform="rotate(20 54 54)"/>
    <g class="ctw" transform="translate(54 18.61)"><path d="M0,-7 L1.4,-1.4 L7,0 L1.4,1.4 L0,7 L-1.4,1.4 L-7,0 L-1.4,-1.4 Z" fill="#fff"/></g>
  </g>
  <rect x="0.75" y="0.75" width="106.5" height="106.5" rx="23.3" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
</g></g>
</svg>
